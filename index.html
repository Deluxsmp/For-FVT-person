<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repo IDE</title><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#dbe4f0;font:14px Inter,system-ui,sans-serif;height:100vh;overflow:hidden}.app{display:grid;grid-template-columns:250px 1fr 330px;height:100vh}.side,.right{background:#0b111d;border-right:1px solid #1b2638}.right{border-left:1px solid #1b2638;border-right:0}.top{height:56px;border-bottom:1px solid #1b2638;display:flex;align-items:center;padding:0 14px;gap:10px}.brand{font-weight:800;font-size:16px}.muted{color:#718096}.btn{background:#121c2d;border:1px solid #25344b;color:#dbe4f0;border-radius:7px;padding:7px 10px;cursor:pointer}.btn:hover{background:#17243a}.primary{background:#2563eb;border-color:#2563eb}.danger{color:#fca5a5}.side .top{justify-content:space-between}.repos{padding:12px}.repo{padding:9px 10px;border-radius:7px;cursor:pointer}.repo.active,.repo:hover{background:#162238}.section{padding:10px 14px;border-bottom:1px solid #1b2638}.actions{display:flex;gap:6px;flex-wrap:wrap}.tree{padding:8px 10px;overflow:auto;height:calc(100vh - 105px)}.node{padding:4px 6px;cursor:pointer;border-radius:5px}.node:hover{background:#111d30}.indent{margin-left:15px}.main{display:flex;flex-direction:column;min-width:0}.tabs{height:42px;background:#0a101b;border-bottom:1px solid #1b2638;display:flex;align-items:center;gap:2px;padding:0 8px;overflow:auto}.tab{padding:8px 11px;border-radius:5px;white-space:nowrap}.tab.active{background:#17243a}.editor{flex:1;display:flex;min-height:0}.line{width:45px;background:#080d16;color:#4b5b70;padding:12px 8px;text-align:right;line-height:21px;overflow:hidden}.code{flex:1;background:#080d16;color:#d7e0eb;border:0;outline:0;resize:none;padding:12px;font:13px/21px ui-monospace,SFMono-Regular,monospace;tab-size:4}.bottom{height:250px;border-top:1px solid #1b2638;background:#080d16;display:flex;flex-direction:column}.bar{display:flex;align-items:center;gap:7px;padding:8px;border-bottom:1px solid #1b2638}.console{flex:1;overflow:auto;padding:10px;white-space:pre-wrap;font:12px/18px ui-monospace,monospace;color:#aebbd0}.terminal-input{display:flex;padding:8px;border-top:1px solid #1b2638}.terminal-input input{flex:1;background:#0b111d;border:1px solid #26364e;color:white;border-radius:6px;padding:8px}.right .content{padding:14px;overflow:auto;height:calc(100vh - 56px)}.card{background:#0f1725;border:1px solid #1c2a3e;border-radius:9px;padding:12px;margin-bottom:10px}.label{font-size:11px;color:#728197;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}.empty{height:100%;display:grid;place-items:center;color:#65758c}.drop{border:1px dashed #33445f;padding:16px;text-align:center;border-radius:8px;color:#7e8da4}
</style></head><body><div class="app"><aside class="side"><div class="top"><div class="brand">⚡ Repo IDE</div><button class="btn" onclick="newRepo()">＋</button></div><div class="section"><div class="label">Repositories</div><div id="repos" class="repos"></div></div><div class="section"><div class="label">File actions</div><div class="actions"><button class="btn" onclick="newFile()">New File</button><button class="btn" onclick="newDir()">New Directory</button><label class="btn">Upload<input hidden type="file" onchange="upload(this.files[0])"></label></div></div><div id="tree" class="tree"></div></aside><main class="main"><div class="top"><span id="repoTitle">No repository</span><span class="muted" id="fileTitle"></span><span style="flex:1"></span><button class="btn primary" onclick="save()">Save</button><button class="btn" onclick="runPython()">▶ Run Python</button></div><div id="tabs" class="tabs"></div><div class="editor"><div id="lines" class="line">1</div><textarea id="code" class="code" spellcheck="false" placeholder="Select a file..."></textarea></div><div class="bottom"><div class="bar"><b>Terminal</b><button class="btn" onclick="clearConsole()">Clear</button><span style="flex:1"></span><span class="muted" id="status">Ready</span></div><div id="console" class="console"></div><div class="terminal-input"><span style="padding:8px 6px;color:#60a5fa">$</span><input id="cmd" placeholder="Type a command and press Enter" onkeydown="if(event.key==='Enter')term()"></div></div></main><aside class="right"><div class="top"><b>Workspace</b></div><div class="content"><div class="card"><div class="label">Current repository</div><div id="infoRepo">—</div></div><div class="card"><div class="label">Open file</div><div id="infoFile">—</div></div><div class="card"><div class="label">Quick start</div><div class="muted">Create a repository, add a Python file, edit it, then press Run Python. Terminal commands execute inside the selected repository.</div></div><div class="drop" id="drop">Upload files from the left panel</div></div></aside></div><script>
let repo='',current='',tabs=[]; const $=id=>document.getElementById(id);
async function api(u,o){let r=await fetch(u,o); if(!r.ok)throw Error(await r.text()); return r.json()}
async function loadRepos(){let rs=await api('/api/repos');$('repos').innerHTML=rs.map(x=>`<div class="repo ${x===repo?'active':''}" onclick="selectRepo('${x.replaceAll("'","\\'")}')">📦 ${x}</div>`).join(''); if(!repo&&rs[0])selectRepo(rs[0]);}
async function newRepo(){let n=prompt('Repository name');if(!n)return;try{await api('/api/repos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});repo=n;current='';tabs=[];await loadRepos();await tree();}catch(e){alert(e.message)}}
async function selectRepo(n){repo=n;current='';tabs=[];await loadRepos();await tree();$('repoTitle').textContent=n;$('infoRepo').textContent=n;$('fileTitle').textContent='';$('code').value='';}
async function tree(){if(!repo)return;let t=await api('/api/tree?repo='+encodeURIComponent(repo));$('tree').innerHTML=t.map(node).join('')}
function node(n){let icon=n.type==='dir'?'📁':'📄';return `<div class="node" onclick="${n.type==='file'?`openFile('${n.path.replaceAll("'","\\'")}')`:''}">${icon} ${n.name}</div>${n.children?'<div class="indent">'+n.children.map(node).join('')+'</div>':''}`}
async function openFile(p){current=p;let c=await fetch('/api/file?path='+encodeURIComponent(p)).then(r=>r.text());$('code').value=c;$('fileTitle').textContent=p;$('infoFile').textContent=p;if(!tabs.includes(p))tabs.push(p);renderTabs();lines()}
function renderTabs(){$('tabs').innerHTML=tabs.map(x=>`<div class="tab ${x===current?'active':''}" onclick="openFile('${x.replaceAll("'","\\'")}')">${x.split('/').pop()}</div>`).join('')}
async function save(){if(!current)return alert('Open a file first');await api('/api/file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:current,content:$('code').value})});$('status').textContent='Saved';setTimeout(()=>$('status').textContent='Ready',1200);await tree()}
async function newFile(){if(!repo)return;let n=prompt('File path, e.g. main.py');if(!n)return;let p=repo+'/'+n;await api('/api/file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p,content:''})});await tree();openFile(p)}
async function newDir(){if(!repo)return;let n=prompt('Directory path');if(!n)return;await api('/api/dir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:repo+'/'+n})});tree()}
async function upload(f){if(!f||!repo)return;let fd=new FormData();fd.append('file',f);fd.append('path',repo+'/'+f.name);await fetch('/api/upload',{method:'POST',body:fd});tree()}
async function runPython(){if(!current||!current.endsWith('.py'))return alert('Open a .py file first');await save();log('$ python3 '+current);let r=await api('/api/run-python',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:current})});log(r.stdout+(r.stderr?'\n'+r.stderr:''));$('status').textContent='Exit '+r.code}
async function term(){let c=$('cmd').value.trim();if(!c||!repo)return;$('cmd').value='';log('$ '+c);try{let r=await api('/api/terminal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repo,command:c})});log(r.output||('(exit '+r.code+')'));}catch(e){log(e.message)}}
function log(x){$('console').textContent+=x+'\n';$('console').scrollTop=$('console').scrollHeight}function clearConsole(){$('console').textContent=''}function lines(){let n=Math.max(1,$('code').value.split('\n').length);$('lines').textContent=Array.from({length:n},(_,i)=>i+1).join('\n')}$('code').addEventListener('input',lines);loadRepos();
</script></body></html>
