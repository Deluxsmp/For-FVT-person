<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffd9e6">
<title>One Question ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 45%,#fff5f8 0,#ffe5ee 38%,#ffd2e1 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  color:#71304c;
}

/* soft background glow */
body:before{
  content:"";
  position:absolute;
  width:360px;height:360px;
  border-radius:50%;
  background:rgba(255,255,255,.42);
  filter:blur(55px);
}

/* decorative background */
.decor{
  position:absolute;
  pointer-events:none;
  user-select:none;
  opacity:.28;
  animation:float 5s ease-in-out infinite;
}
.a{top:9%;right:9%;font-size:38px;color:#f39ab6}
.b{top:27%;left:15%;font-size:25px;color:#e99ab3;animation-delay:1s}
.c{top:40%;right:4%;font-size:34px;color:#f39ab6;animation-delay:2s}
.d{bottom:19%;left:13%;font-size:24px;color:#e99ab3;animation-delay:.6s}
.e{bottom:7%;right:8%;font-size:32px;color:#ef9ab5;animation-delay:1.5s}
.f{top:17%;left:43%;font-size:22px;color:#f1b5c8;animation-delay:2.5s}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(-4deg)}
  50%{transform:translateY(-9px) rotate(5deg)}
}

/* card */
.card{
  width:calc(100% - 68px);
  max-width:620px;
  min-height:545px;
  border-radius:58px;
  padding:48px 24px;
  background:rgba(255,255,255,.62);
  border:1.5px solid rgba(255,255,255,.9);
  box-shadow:
    0 25px 70px rgba(190,70,115,.15),
    inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  z-index:2;
  overflow:hidden;
}

.question h1{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(43px,11vw,72px);
  line-height:1.04;
  color:#8a3153;
}

.question p{
  margin:17px auto 30px;
  color:#95667a;
  font-size:14px;
  line-height:1.6;
  max-width:320px;
}

.heart{
  font-size:78px;
  line-height:1;
  margin-bottom:25px;
  animation:beat 1.15s ease-in-out infinite;
  filter:drop-shadow(0 7px 8px rgba(220,45,80,.18));
}
@keyframes beat{
  0%,100%{transform:scale(1)}
  15%{transform:scale(1.1)}
  30%{transform:scale(1)}
  45%{transform:scale(1.06)}
}

/* buttons */
.buttons{
  width:100%;
  height:125px;
  position:relative;
}

button{
  position:absolute;
  top:36px;
  border:0;
  border-radius:50px;
  padding:14px 27px;
  font-size:14px;
  font-weight:700;
  font-family:Arial,sans-serif;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.yes{
  left:17%;
  color:white;
  background:linear-gradient(135deg,#f45282,#d9366c);
  box-shadow:0 10px 25px rgba(217,54,108,.28);
}

.no{
  left:58%;
  color:#956276;
  background:#fff;
  border:1px solid #f0c8d6;
  transition:left .22s ease,top .22s ease;
}

button:active{transform:scale(.94)}

.result{
  display:none;
  animation:show .7s ease;
}
.result.show{display:block}

.result h2{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(45px,11vw,70px);
  line-height:1.03;
  color:#d92f6c;
  text-transform:uppercase;
}

.result .bigheart{
  font-size:82px;
  margin:17px 0 27px;
  animation:beat 1.1s infinite;
}

.result p{
  color:#806172;
  font-size:clamp(16px,4vw,23px);
  line-height:1.5;
}

@keyframes show{
  from{opacity:0;transform:scale(.8) translateY(20px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}

.footer{
  position:fixed;
  bottom:34px;
  left:0;
  right:0;
  text-align:center;
  color:#9d7b89;
  font-size:10px;
  letter-spacing:3px;
  z-index:3;
}
.footer span{color:#df3c70}

.burst{
  position:fixed;
  z-index:5;
  pointer-events:none;
  animation:burst 1.5s ease forwards;
  font-size:20px;
}
@keyframes burst{
  0%{transform:translate(0,0) scale(.5);opacity:1}
  100%{transform:translate(var(--x),var(--y)) scale(1.2);opacity:0}
}

@media(max-width:420px){
  .card{
    width:calc(100% - 68px);
    min-height:545px;
    border-radius:48px;
  }
}
</style>
</head>

<body>

<div class="decor a">♡</div>
<div class="decor b">✦</div>
<div class="decor c">♥</div>
<div class="decor d">♡</div>
<div class="decor e">✦</div>
<div class="decor f">♡</div>

<main class="card">

  <div class="question" id="question">
    <div class="heart">❤️</div>

    <h1>Do you<br>love me?</h1>

    <p>
      Be honest... 👀<br>
      I really want to know.
    </p>

    <div class="buttons" id="buttons">
      <button class="yes" onclick="yesClick()">YES 🙈</button>
      <button class="no" id="no" onclick="noClick()">NO 😫</button>
    </div>
  </div>

  <div class="result" id="result">
    <h2>I LOVE<br>YOU TOOO!</h2>
    <div class="bigheart">❤️</div>
    <p>Okay... now you officially made my heart happy. 🥹💕</p>
  </div>

</main>

<div class="footer">MADE WITH LOVE <span>❤️</span></div>

<script>
let count=0;

function noClick(){
  const btn=document.getElementById("no");
  const area=document.getElementById("buttons");

  const maxX=area.clientWidth-btn.offsetWidth;
  const maxY=area.clientHeight-btn.offsetHeight;

  btn.style.left=Math.max(0,Math.random()*maxX)+"px";
  btn.style.top=Math.max(0,Math.random()*maxY)+"px";

  count++;

  if(count===2) btn.textContent="Are you sure? 🥺";
  if(count===4) btn.textContent="Really? 😭";
  if(count>=6) btn.textContent="You can't escape 😂";
}

function yesClick(){
  document.getElementById("question").style.display="none";
  document.getElementById("result").classList.add("show");

  for(let i=0;i<24;i++){
    setTimeout(()=>{
      const e=document.createElement("div");
      e.className="burst";
      e.textContent=["❤️","💕","💗","♡","✨"][Math.floor(Math.random()*5)];
      e.style.left="50%";
      e.style.top="50%";
      e.style.setProperty("--x",(Math.random()*360-180)+"px");
      e.style.setProperty("--y",(Math.random()*520-260)+"px");
      document.body.appendChild(e);
      setTimeout(()=>e.remove(),1500);
    },i*45);
  }
}
</script>

</body>
</html>
